name: One-Time Branch Archive and Prune
on:
  workflow_run:
    workflows: ["Deploy BabyMemo to Cloudflare"]
    types: [completed]
permissions:
  contents: write
jobs:
  archive-and-prune:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      ARCHIVE: archive/pr64-20261014
    steps:
      - name: Only run once after successful deployment of PR 64
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$DEPLOY_SHA" == "$current" ]] || { echo "Main advanced since deployment; skip cleanup"; exit 0; }
          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA" --jq '.commit.message')
          [[ "$message" == "Merge PR #64: TypeScript, docs and privacy demo"* ]] || { echo "Not the PR 64 release; skip cleanup"; exit 0; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ARCHIVE-completed" >/dev/null 2>&1; then
            echo "Already completed"; exit 0
          fi
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq 'length')
          [[ "$open" -eq 0 ]] || { echo "Open PRs remain; refuse to prune"; exit 1; }

          # Make lightweight archival tags for every branch BEFORE deleting anything.
          declare -a names=()
          while IFS=$'\t' read -r name sha; do
            [[ "$name" == "main" ]] && continue
            names+=("$name")
            tag="$ARCHIVE/$name"
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv')
          echo "Archived ${#names[@]} branches as lightweight tags" >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for name in "${names[@]}"; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" >/dev/null; then
              echo "Deleted: $name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAILED deleting: $name" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          [[ "$failed" == 0 ]] || exit 1
          remaining=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -v '^main$' || true)
          [[ -z "$remaining" ]] || { echo "Remaining branches: $remaining"; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$ARCHIVE-completed" -f "sha=$DEPLOY_SHA" >/dev/null
          echo "Only main remains; source commits preserved in archive tags." >> "$GITHUB_STEP_SUMMARY"
