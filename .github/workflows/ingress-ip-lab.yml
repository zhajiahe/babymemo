name: Cloudflare ingress IP lab (second round)
on:
  pull_request:
    paths:
      - 'scripts/ingress-ip-lab-worker.mjs'
      - 'scripts/check-ip-lab.mjs'
      - 'docs/CF-INGRESS-LAB-2.md'
      - '.github/workflows/ingress-ip-lab.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/ingress-ip-lab-worker.mjs && node --check scripts/check-ip-lab.mjs
      - name: Verify dashboard JavaScript, isolated permissions, and synthetic binary streaming
        run: node --test scripts/ingress-ip-lab-worker.test.mjs
      - name: Validate public DNS, HTTPS, cross-origin browser access, and Worker bindings
        run: node scripts/check-ip-lab.mjs
