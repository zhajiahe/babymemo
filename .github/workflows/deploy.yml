name: Deploy BabyMemo to Cloudflare

on:
  workflow_run:
    workflows: ["Check BabyMemo"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only verify resources, typecheck, build, and dry-run; do not deploy or migrate"
        type: boolean
        default: true
      provision:
        description: "Create D1/R2 resources if missing (not used during dry-run)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: babymemo-production
  cancel-in-progress: false

jobs:
  gate:
    name: Select tested revision
    # Trust only successful same-repository main push CI, never PR or fork CI.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.select.outputs.proceed }}
      revision: ${{ steps.select.outputs.revision }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      provision: ${{ steps.select.outputs.provision }}
    steps:
      - uses: actions/checkout@v4
      - name: Select tested revision or manual ref
        id: select
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_PROVISION: ${{ inputs.provision }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_KIND" == "workflow_dispatch" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "revision=$MANUAL_SHA" >> "$GITHUB_OUTPUT"
            echo "dry_run=$MANUAL_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "provision=$MANUAL_PROVISION" >> "$GITHUB_OUTPUT"
          else
            current="$(git ls-remote origin refs/heads/main | cut -f1)"
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unable to verify main revision"; exit 1; }
            if [[ "$current" != "$TESTED_SHA" ]]; then
              echo "::notice::Skipping outdated CI revision $TESTED_SHA; current main is $current"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "revision=$TESTED_SHA" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            # An unattended release must never create a new D1 or R2 resource.
            echo "provision=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BABYMEMO_PUBLIC_URL: ${{ vars.BABYMEMO_PUBLIC_URL }}
      DRY_RUN: ${{ needs.gate.outputs.dry_run }}
      PROVISION: ${{ needs.gate.outputs.provision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Validate production secrets (manual release)
        if: ${{ github.event_name == 'workflow_dispatch' && needs.gate.outputs.dry_run == 'false' }}
        shell: bash
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          set -euo pipefail
          for name in SESSION_SECRET DATA_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing GitHub Secret::$name is required for production deployment"
              exit 1
            fi
          done
          [[ "$DATA_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::DATA_KEY must be a 32-byte hexadecimal key"; exit 1; }
          [[ "${#SESSION_SECRET}" -ge 32 ]] || { echo "::error::SESSION_SECRET must be at least 32 characters"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Provision or inspect Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" || "$PROVISION" != "true" ]]; then
            npm run provision:remote -- --check
          else
            npm run provision:remote
          fi
      - name: Typecheck and build
        run: npm run verify
      - name: Recheck latest main before unattended release
        id: latest
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.revision }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unable to verify main revision"; exit 1; }
          if [[ "$current" == "$EXPECTED_SHA" ]]; then
            echo "safe_to_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe_to_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale revision $EXPECTED_SHA; latest main is $current"
          fi
      - name: Wrangler publish preview
        if: ${{ needs.gate.outputs.dry_run == 'true' }}
        run: npx wrangler deploy --dry-run
      - name: Reconcile previously applied birth_time schema (migration history only)
        if: ${{ needs.gate.outputs.dry_run == 'false' && (github.event_name == 'workflow_dispatch' || steps.latest.outputs.safe_to_publish == 'true') }}
        run: node scripts/reconcile-birth-time.mjs
      - name: Apply remote database migrations
        if: ${{ needs.gate.outputs.dry_run == 'false' && (github.event_name == 'workflow_dispatch' || steps.latest.outputs.safe_to_publish == 'true') }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Prepare optional OpenRouter Secret for atomic Worker deployment
        if: ${{ needs.gate.outputs.dry_run == 'false' && (github.event_name == 'workflow_dispatch' || steps.latest.outputs.safe_to_publish == 'true') }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/prepare-openrouter-secret.mjs
      - name: Publish Worker (retry transient Cloudflare API errors)
        if: ${{ needs.gate.outputs.dry_run == 'false' && (github.event_name == 'workflow_dispatch' || steps.latest.outputs.safe_to_publish == 'true') }}
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.revision }}
        run: bash scripts/deploy-worker-with-retry.sh
      # Auto-deploy preserves existing SESSION_SECRET and DATA_KEY values.
      # Optional OpenRouter API Key is uploaded atomically with code.
      - name: Sync configured Worker secrets (manual release only)
        if: ${{ github.event_name == 'workflow_dispatch' && needs.gate.outputs.dry_run == 'false' }}
        shell: bash
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          set -euo pipefail
          for name in SESSION_SECRET DATA_KEY; do
            if [[ -n "${!name}" ]]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" > /dev/null
            else
              echo "::warning::$name not synced: repository secret absent. Existing Worker secret (if any) is kept."
            fi
          done
      - name: Remove temporary OpenRouter Secret file
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${BABYMEMO_SECRETS_FILE:-}" ]]; then
            rm -f -- "$BABYMEMO_SECRETS_FILE"
          fi
      - name: Smoke-check the published instance
        if: ${{ needs.gate.outputs.dry_run == 'false' && (github.event_name == 'workflow_dispatch' || steps.latest.outputs.safe_to_publish == 'true') }}
        run: npm run smoke:check
