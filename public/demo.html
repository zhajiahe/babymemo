<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BabyMemo · 安全演示</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#243448;background:#f7fafd}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:grid;grid-template-columns:210px 1fr}aside{background:#fff;border-right:1px solid #dde6ef;padding:28px 18px}.brand{font-size:24px;font-weight:800;color:#2165a8}.nav{width:100%;display:block;text-align:left;padding:13px;border:0;border-radius:12px;margin-top:10px;background:transparent;color:#586d80;font-size:15px;cursor:pointer}.nav[aria-current=page]{background:#e9f2fb;color:#2165a8;font-weight:700}main{max-width:1030px;width:100%;padding:42px;margin:auto}.notice{background:#e9f2fb;padding:12px 18px;border-radius:12px;font-size:13px}.muted{color:#586d80}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border:1px solid #dde6ef;border-radius:17px;padding:20px;box-shadow:0 4px 24px #1e2d3c0a}.art{height:135px;border-radius:12px;background:linear-gradient(135deg,#fce8d9,#d8eafa);display:grid;place-items:center;font-size:52px;position:relative}.play{position:absolute;bottom:10px;right:10px;background:#243448dd;color:white;border-radius:30px;padding:7px 12px;font-size:13px}.kpi{font-weight:750;font-size:29px}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e5edf5;padding:12px 0}button:focus-visible{outline:3px solid #2165a8;outline-offset:2px}@media(max-width:650px){.shell{display:block}aside{display:flex;align-items:center;gap:10px;padding:12px;overflow:auto}.brand{font-size:18px;flex-shrink:0}.nav{width:auto;white-space:nowrap;margin:0;padding:10px}main{padding:18px}}
</style></head><body><div class="shell"><aside><div class="brand">BabyMemo</div><button class="nav" aria-current="page" data-tab="home">首页</button><button class="nav" data-tab="album">相册</button><button class="nav" data-tab="growth">成长</button><button class="nav" data-tab="moments">瞬间</button><button class="nav" data-tab="wechat">微信操作</button></aside><main><p class="notice">🔒 纯静态模拟 Demo · 所有姓名、日期和事件均为虚构数据 · 不登录、不访问 API、不使用 D1 / R2 / 微信</p><h1 id="title">小星星的成长日记</h1><p class="muted" id="subtitle">一个用于展示产品交互与视觉的虚构家庭空间</p><section id="content" aria-live="polite"></section></main></div><script>
const views={
home:['小星星的成长日记','示例家庭 · 成长记录概览','<div class="cards"><div class="card"><h3>相册</h3><div class="art">🧸</div><p>记录每一个微笑和第一次</p></div><div class="card"><h3>成长</h3><div class="kpi">7.6 kg</div><p>模拟最近一次体重记录</p></div><div class="card"><h3>成长瞬间</h3><p>第一次扶着沙发站起来啦！</p><p class="muted">虚构日期 · 10 月 10 日</p></div></div>'],
album:['相册','照片与视频一目了然；视频缩略图带播放标识','<div class="cards"><div class="card"><div class="art">🌼</div><h3>公园散步</h3><p class="muted">模拟照片 · 10 月 12 日</p></div><div class="card"><div class="art">🎠<span class="play">▶ 视频</span></div><h3>第一次坐旋转木马</h3><p class="muted">模拟视频 · 不含真实文件</p></div><div class="card"><div class="art">🎂</div><h3>生日快乐</h3><p class="muted">模拟照片 · 9 月 20 日</p></div></div>'],
growth:['成长记录','示例数值，不代表任何真实儿童或健康建议','<div class="card"><div class="item"><b>10 月 10 日</b><span>体重 7.6 kg · 身高 69 cm</span></div><div class="item"><b>9 月 10 日</b><span>体重 7.1 kg · 身高 67 cm</span></div><div class="item"><b>8 月 10 日</b><span>体重 6.8 kg · 身高 65 cm</span></div></div>'],
moments:['成长瞬间','示例日记，可展示文字记录方式','<div class="card"><h3>第一次扶站</h3><p>今天扶着沙发站起来了，大家都很开心。</p><p class="muted">虚构事件 · 10 月 10 日</p></div>'],
wechat:['微信操作','展示多家庭成员微信入口与工具能力（仅模拟）','<div class="card"><h3>成员连接</h3><div class="item"><b>家人 A</b><span>● 已连接（演示状态）</span></div><div class="item"><b>家人 B</b><span>● 已连接（演示状态）</span></div><p class="muted">文字增删改查、照片和视频上传、短期多轮会话；此页不会连接微信或调用 AI。</p></div>']
};
function render(tab){const v=views[tab]||views.home;document.getElementById('title').textContent=v[0];document.getElementById('subtitle').textContent=v[1];document.getElementById('content').innerHTML=v[2];document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'))}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));render('home');
</script></body></html>
