name: Cloudflare ingress route experiment
on:
  pull_request:
    paths:
      - 'scripts/check-cf-ingress.mjs'
      - 'docs/CF-INGRESS-EXPERIMENT.md'
      - '.github/workflows/ingress-ip-experiment.yml'
permissions:
  contents: read
jobs:
  probe:
    name: Public HTTPS, DNS and Worker route smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public synthetic probes (failure is experimental data)
        run: node scripts/check-cf-ingress.mjs
