name: Manual Harness Deep E2E

# No push, pull_request, deployment, or cron trigger: real LLM tests consume
# Workers AI Neurons and/or OpenRouter credits, so require a human dispatch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "offline (no inference) or live (real model calls)"
        type: choice
        options: [offline, live]
        default: offline
      offline_cases:
        description: "Deterministic offline combinations (only used in offline mode)"
        type: choice
        options: ["240", "1200", "3000"]
        default: "240"
      provider:
        description: "Live benchmark provider; both uses identical ten-case corpus"
        type: choice
        options: [both, workers-ai, openrouter]
        default: both
      repetitions:
        description: "Repeat every one of the ten live scenarios this many times"
        type: choice
        options: ["1", "3"]
        default: "1"
      max_neurons:
        description: "Soft budget for total Workers AI Neurons in this run"
        type: choice
        options: ["1000", "3000", "6000"]
        default: "3000"
      max_usd:
        description: "Soft budget for reported OpenRouter USD in this run"
        type: choice
        options: ["0.05", "0.10", "0.50"]
        default: "0.10"
      model_id:
        description: "OpenRouter model: Muse default or deepseek/deepseek-v4.1-flash (reasoning disabled by default)"
        type: string
        default: "meta/muse-spark-1.3-contributor"
      reasoning_mode:
        description: "OpenRouter reasoning: auto disables DeepSeek V4.1 Flash; off explicitly disables; low enables low thinking"
        type: choice
        options: [auto, off, low]
        default: auto
      confirm_live:
        description: "I explicitly approve real AI requests that may consume Neurons or credits"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: babymemo-manual-harness
  cancel-in-progress: false

jobs:
  offline:
    if: inputs.mode == 'offline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Deterministic synthetic scenarios (no external API)
        env:
          HARNESS_CASES: ${{ inputs.offline_cases }}
        run: npm run test:harness:deep
      - name: Verify canonical model benchmark scoring (offline)
        run: node --test scripts/model-benchmark.test.mjs

  live:
    if: inputs.mode == 'live' && inputs.confirm_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Confirm manual real-model testing and run identical scenarios
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # fallback only; 10000 is reported as permission issue
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODEL_BENCH_CONFIRM: "YES"
          MODEL_BENCH_PROVIDER: ${{ inputs.provider }}
          MODEL_BENCH_REPETITIONS: ${{ inputs.repetitions }}
          MODEL_BENCH_MAX_NEURONS: ${{ inputs.max_neurons }}
          MODEL_BENCH_MAX_USD: ${{ inputs.max_usd }}
          MODEL_BENCH_OPENROUTER_MODEL: ${{ inputs.model_id }}
          MODEL_BENCH_REASONING_MODE: ${{ inputs.reasoning_mode }}
          MODEL_BENCH_REPORT_FILE: "model-benchmark-report.json"
        run: npm run test:model:benchmark
      - name: Upload synthetic benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-model-benchmark-results
          path: model-benchmark-report.json
          if-no-files-found: warn
          retention-days: 7

  confirmation-required:
    if: inputs.mode == 'live' && inputs.confirm_live != true
    runs-on: ubuntu-latest
    steps:
      - name: Reject unconfirmed billable benchmark
        run: |
          echo "::error::Live benchmark requires confirm_live=true. No external model requests were made."
          exit 1
