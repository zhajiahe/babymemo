plugins { id 'com.android.application' }
android {
    namespace 'app.babymemo.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'app.babymemo.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'TV_URL', '"https://babymemo.zhajiahe1994.workers.dev/tv"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
