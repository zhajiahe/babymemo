name: Check BabyMemo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check deployment scripts syntax
        run: node --check scripts/provision-cloudflare.mjs && node --check scripts/smoke-check.mjs
      - run: npm run check
      - run: npm run build
