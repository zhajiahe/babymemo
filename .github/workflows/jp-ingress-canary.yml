name: JP-1 ingress migration canary
on:
  pull_request:
    paths:
      - 'scripts/check-jp-ingress-canary.mjs'
      - 'docs/JP-INGRESS-MIGRATION.md'
      - '.github/workflows/jp-ingress-canary.yml'
permissions:
  contents: read
jobs:
  canary:
    name: Validate production Worker through JP-1 ingress (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-jp-ingress-canary.mjs
      - run: node scripts/check-jp-ingress-canary.mjs
