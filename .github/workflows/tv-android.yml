name: BabyMemo TV APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tv-android/**"
      - "src/TvApp.tsx"
      - "src/tv.css"
      - "src/tv-api.ts"
      - "src/worker.ts"
      - "src/main.tsx"
      - "migrations/*tv*"
      - ".github/workflows/tv-android.yml"
  push:
    branches: [main]
    paths:
      - "tv-android/**"
      - "src/TvApp.tsx"
      - "src/tv.css"
      - "src/tv-api.ts"
      - "src/worker.ts"
      - "src/main.tsx"
      - "migrations/*tv*"
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run verify
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK 34
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build test APK
        working-directory: tv-android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: babymemo-tv-test-apk
          path: tv-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
