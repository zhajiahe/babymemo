name: Manual Harness Deep E2E

# Only explicit workflow_dispatch: never from PR, push, schedule or deployment.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "offline: deterministic scenarios; live: billable OpenRouter requests"
        type: choice
        options: [offline, live]
        default: offline
      offline_cases:
        description: "Only used in offline mode; number of test combinations"
        type: choice
        options: ["240", "1200", "3000"]
        default: "240"
      live_cases:
        description: "Only used in live mode; number of synthetic tasks (may each use multiple API calls)"
        type: choice
        options: ["1", "5", "16", "30", "60"]
        default: "5"
      model_id:
        description: "OpenRouter model for live synthetic tests"
        type: string
        default: "meta/muse-spark-1.3-contributor"

permissions:
  contents: read

concurrency:
  group: babymemo-manual-harness
  cancel-in-progress: false

jobs:
  offline:
    if: inputs.mode == 'offline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Deterministic synthetic scenarios (no external API)
        env:
          HARNESS_CASES: ${{ inputs.offline_cases }}
        run: npm run test:harness:deep

  live:
    if: inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Synthetic OpenRouter tool-routing assessment (manual, billable)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_E2E_CONFIRM: 'YES'
          HARNESS_LIVE_CONFIRM: 'YES'
          HARNESS_LIVE_CASES: ${{ inputs.live_cases }}
          HARNESS_TEST_MODEL: ${{ inputs.model_id }}
        run: npm run test:harness:live
