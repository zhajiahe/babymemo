name: Deploy BabyMemo to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babymemo-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker (auto-provision resources)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync existing configured secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          set -euo pipefail
          for name in BOOTSTRAP_SECRET SESSION_SECRET DATA_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" >/dev/null
            fi
          done
