name: Check BabyMemo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/provision-cloudflare.mjs && node --check scripts/smoke-check.mjs
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Local Worker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:e2e

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - run: npm run build
      - run: npm run test:e2e
        env:
          BROWSER_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babymemo-e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore
