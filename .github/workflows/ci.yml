name: Check BabyMemo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/provision-cloudflare.mjs && node --check scripts/smoke-check.mjs && node --check scripts/family-backup.mjs && node --check scripts/reconcile-birth-time.mjs && node --check scripts/prepare-openrouter-secret.mjs
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - name: Bundle isolated Cron pilot without deploying
        run: npx wrangler deploy --config wrangler.wechat-pilot.jsonc --dry-run --outdir /tmp/babymemo-cron-pilot

  e2e:
    name: Local Worker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:e2e
      - name: Verify deploy-managed OpenRouter Key flow (isolated)
        run: E2E_DEPLOY_KEY=1 npm run test:e2e
      - name: Verify WeChat message processing in the Worker runtime (isolated)
        run: node scripts/wechat-worker-e2e.mjs

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - run: npm run build
      - run: npm run test:e2e
        env:
          BROWSER_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babymemo-e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore

  webkit-e2e:
    name: Safari-engine WebKit E2E (simulated slow network)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npm run test:e2e
        env:
          BROWSER_E2E: '1'
          BROWSER_ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babymemo-webkit-e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore
